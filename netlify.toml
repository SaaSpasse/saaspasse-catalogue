# Les sources 2026 restent archivées dans Git; seuls les fichiers de migration
# sont publiés. Conserver le domaine et HTTPS existants sans changer le DNS.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[edge_functions]]
  function = "catalogue-redirect"
  path = "/*"

[context.deploy-preview]
  [[context.deploy-preview.headers]]
    for = "/*"
    [context.deploy-preview.headers.values]
      X-Robots-Tag = "noindex, nofollow"
